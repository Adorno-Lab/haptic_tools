# The pose mapping example (examples/haptic_pose_mapping_example) with the scene scenes/pose_mapping.ttt: the haptic
# device sets the pose of the frame xd of the scene, as seen from the camera of the main view.
#   coppeliasim:  the scene (the sas_object_script of x, xd, and DefaultCamera publish and set their poses).
#   mapping:      haptic_pose_mapping_example_node: xd from the device, starting from x at each press of the clutch.
# and one source of the haptic device, chosen with a profile (both publish the same topics: never run both):
#   haptic_simulator (profile haptic_simulator, the default, set in .env): the simulator of the haptic device
#                 (haptic_simulator), when the Touch X is not available. Press the clutch with the space bar.
#   udp_receiver (profile touch_x): the real Touch X. The UDP receiver of sas_operator_side_receiver publishes the data of
#                 the Touch X, sent by the Windows computer. It binds to 192.168.8.100, ports 2222 and 2223 (the
#                 defaults of udp_receiver_launch.py of haptic_navigation): this computer must have that address, on the
#                 network of the Windows computer.
# All talk only through ROS 2 (ROS_DOMAIN_ID=77, set in the images). Do not run other nodes of the same device (e.g.
# another UDP receiver) at the same time, on the same ROS_DOMAIN_ID.
#
# From this folder (xhost +local:root if the X server refuses the connection), then start the simulation in CoppeliaSim:
#   docker compose up --build                                  # with haptic_simulator (profile from .env)
#   docker compose --profile touch_x up --build                # with the real Touch X instead (the flag replaces the
#                                                              # profile of .env)
services:
  coppeliasim:
    image: haptic_tools_jazzy_coppeliasim
    build:
      context: ../../..
      dockerfile: devel/haptic_tools_jazzy_coppeliasim/Dockerfile
    environment:
      DISPLAY: $DISPLAY  # x server related
      XAUTHORITY: /root/.Xauthority  # x server related
      QT_X11_NO_MITSHM: 1  # x server related
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro # x server related
      # Mounted, not copied, so that the scenes saved from CoppeliaSim land in the repository.
      - ../../../scenes:/app/scenes
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
            $${COPPELIASIM_PATH}/coppeliaSim.sh /app/scenes/pose_mapping.ttt"

  mapping:
    image: haptic_tools_jazzy
    build:
      context: ../../..
      dockerfile: devel/haptic_tools_jazzy/Dockerfile
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
            ros2 launch haptic_pose_mapping_example haptic_pose_mapping_example_launch.py device:=none"

  haptic_simulator:
    profiles: ["haptic_simulator"]
    image: haptic_tools_jazzy
    build:
      context: ../../..
      dockerfile: devel/haptic_tools_jazzy/Dockerfile
    environment:
      DISPLAY: $DISPLAY  # x server related
      XAUTHORITY: /root/.Xauthority  # x server related
      QT_X11_NO_MITSHM: 1  # x server related
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro # x server related
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
            ros2 launch haptic_simulator haptic_simulator_launch.py"

  udp_receiver:
    profiles: ["touch_x"]
    image: haptic_tools_jazzy
    build:
      context: ../../..
      dockerfile: devel/haptic_tools_jazzy/Dockerfile
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
            ros2 launch haptic_navigation udp_receiver_launch.py"
